# Git hooks that run before each commit. Setup (once):
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# Update hook versions any time with: pre-commit autoupdate

# Hooks run on `git commit` (file checks) unless they set their own stage.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key          # stop secrets before they reach GitHub

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit     # commit messages must be feat:, fix:, docs: ...
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        pass_filenames: false
        types: [go]
