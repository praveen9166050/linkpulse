# The LinkPulse HTTP API contract. Written BEFORE the code (API-first):
# the server must match it, and clients are generated from it.
# Lint: npm run lint:api    Preview docs: npx redocly preview-docs api/openapi.yaml
openapi: 3.1.0

info:
    title: LinkPulse API
    version: 0.1.0
    summary: Shorten URLs and redirect short links.
    description: |
        Management endpoints live under `/api/v1`. Redirects live at the root
        (`/{code}`) so short links stay short.

        Errors use RFC 9457 Problem Details (`application/problem+json`).
    license:
        name: MIT
        identifier: MIT

servers:
    - url: http://localhost:3000
      description: Local development

tags:
    - name: Links
      description: Create and list short links.
    - name: Redirects
      description: Follow a short link to its target.
    - name: Operations
      description: Health checks for load balancers and monitoring.
    - name: Development
      description: Tools for local development only, switched on with DEV_TOOLS=true.

# No authentication until Phase 3 (Cognito). Stated explicitly so it is a decision, not an omission.
security: []

paths:
    /api/v1/links:
        get:
            operationId: listLinks
            tags: [Links]
            summary: List links, newest first
            description: |
                One page of links, newest first. To get the next page, pass the
                response's `nextCursor` back as `cursor`; `nextCursor` is `null` on the
                last page. The cursor is opaque: clients must not build or edit it.
                Pages stay stable while links are created (no duplicates, nothing
                skipped), and every page costs the same, however deep.
            parameters:
                - name: limit
                  in: query
                  description: How many links per page.
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                - name: cursor
                  in: query
                  description: The `nextCursor` of the previous page. Omit for the first page.
                  schema:
                      type: string
            responses:
                "200":
                    description: One page of links.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LinkPage"
                "400":
                    $ref: "#/components/responses/InvalidQuery"

        post:
            operationId: createLink
            tags: [Links]
            summary: Create a short link
            description: |
                Shortens `url`. Pass `code` to choose a custom short code; otherwise a
                random 7-character code is generated. Pass `expiresAt` to make the link
                stop working at that time.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateLinkRequest"
                        examples:
                            generated:
                                summary: Generated code
                                value:
                                    url: https://example.com/articles/2026/how-dns-works
                            custom:
                                summary: Custom code with expiry
                                value:
                                    url: https://example.com/cv.pdf
                                    code: my-resume
                                    expiresAt: "2027-01-31T23:59:59Z"
            responses:
                "201":
                    description: The link was created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Link"
                "400":
                    $ref: "#/components/responses/ValidationError"
                "409":
                    $ref: "#/components/responses/CodeTaken"
                "413":
                    $ref: "#/components/responses/BodyTooLarge"

    /api/v1/dev/requests:
        get:
            operationId: streamRequests
            tags: [Development]
            summary: Live request log (development only)
            description: |
                **Exists only when the API runs with `DEV_TOOLS=true`; otherwise 404.**
                Never enable in production: it exposes every request path.

                A Server-Sent Events stream that never ends. It first replays the most
                recent requests (up to 50), then sends one event per request as the
                API handles it:

                ```
                id: 42
                event: request
                data: {"id":42,"at":"2026-11-14T10:00:00.000Z","method":"GET","path":"/health","status":200,"durationMs":3.21}
                ```

                Comment lines (`: heartbeat`) keep the connection alive every 15 s. A
                client that reads too slowly misses events rather than slowing the API.
            responses:
                "200":
                    description: The event stream. Each event's `data` is a `RequestLogEntry`.
                    content:
                        text/event-stream:
                            schema:
                                type: string
                "404":
                    $ref: "#/components/responses/NotFound"

    /{code}:
        get:
            operationId: followLink
            tags: [Redirects]
            summary: Follow a short link
            description: |
                Redirects to the link's target URL with **302 Found**, not 301: browsers
                cache a 301 forever, so repeat clicks would never reach the server and
                could not be counted. `Cache-Control: no-store` keeps proxies from caching
                it too. See ADR 0003.
            parameters:
                - name: code
                  in: path
                  required: true
                  description: The short code, for example `aZ3kP9q`.
                  schema:
                      $ref: "#/components/schemas/ShortCode"
            responses:
                "302":
                    description: Redirect to the target URL.
                    headers:
                        Location:
                            description: The target URL.
                            schema:
                                type: string
                                format: uri
                        Cache-Control:
                            description: Always `no-store`, so every click reaches the server.
                            schema:
                                type: string
                                const: no-store
                "404":
                    $ref: "#/components/responses/NotFound"

    /health:
        get:
            operationId: getHealth
            tags: [Operations]
            summary: Check service health
            description: |
                Used by load balancers to decide whether to send traffic here (a
                readiness check). Reports `degraded` with **503** when this instance
                can't serve requests well: MongoDB doesn't answer a ping within 2
                seconds, or the event loop is lagging (CPU-bound work is blocking it),
                so traffic moves to a healthy instance. Never cached.
            responses:
                "200":
                    description: The service is healthy.
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                                const: no-store
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Health"
                            example:
                                status: ok
                                database:
                                    status: up
                                    latencyMs: 32
                                eventLoopDelayMs:
                                    p50: 10.2
                                    p99: 12.6
                                uptimeSeconds: 3600.5
                "503":
                    description: The service is degraded; send traffic elsewhere.
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                                const: no-store
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Health"
                            example:
                                status: degraded
                                database:
                                    status: down
                                    latencyMs: null
                                eventLoopDelayMs:
                                    p50: 10.1
                                    p99: 11.8
                                uptimeSeconds: 3600.5

components:
    schemas:
        ShortCode:
            type: string
            description: |
                3 to 32 letters, digits or hyphens. No hyphen at the start or end, no
                two hyphens in a row, and not a reserved route name such as `api` or
                `health` (checked by the server, case-insensitively). Case-sensitive.
            minLength: 3
            maxLength: 32
            pattern: "^(?!-)(?!.*--)[A-Za-z0-9-]{3,32}(?<!-)$"
            examples: [aZ3kP9q, my-resume]

        CreateLinkRequest:
            type: object
            required: [url]
            additionalProperties: false
            properties:
                url:
                    type: string
                    format: uri
                    maxLength: 2048
                    description: The long URL to shorten. Must be `http` or `https`.
                    examples: [https://example.com/articles/2026/how-dns-works]
                code:
                    $ref: "#/components/schemas/ShortCode"
                expiresAt:
                    type: string
                    format: date-time
                    description: When the link stops working. Must be in the future.

        Link:
            type: object
            required: [code, shortUrl, url, createdAt, expiresAt]
            properties:
                code:
                    $ref: "#/components/schemas/ShortCode"
                shortUrl:
                    type: string
                    format: uri
                    description: The full short link to share.
                    examples: [http://localhost:3000/aZ3kP9q]
                url:
                    type: string
                    format: uri
                    description: The target URL.
                createdAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: [string, "null"]
                    format: date-time
                    description: When the link stops working, or `null` if never.

        LinkPage:
            type: object
            required: [items, nextCursor]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Link"
                nextCursor:
                    type: ["string", "null"]
                    description: Pass as `cursor` to get the next page; `null` on the last page.
            example:
                items:
                    - code: aZ3kP9q
                      shortUrl: http://localhost:3000/aZ3kP9q
                      url: https://example.com/articles/2026/how-dns-works
                      createdAt: "2026-11-14T09:30:00.000Z"
                      expiresAt: null
                nextCursor: eyJjcmVhdGVkQXQiOiIyMDI2LTExLTE0VDA5OjMwOjAwLjAwMFoiLCJjb2RlIjoiYVoza1A5cSJ9

        RequestLogEntry:
            type: object
            description: One handled request, as sent in the live request log.
            required: [id, at, method, path, status, durationMs]
            properties:
                id:
                    type: integer
                    description: Increasing number; also the SSE event id.
                at:
                    type: string
                    format: date-time
                    description: When the response finished.
                method:
                    type: string
                path:
                    type: string
                    description: The path, without the query string.
                status:
                    type: integer
                durationMs:
                    type: number

        Health:
            type: object
            required: [status, database, eventLoopDelayMs, uptimeSeconds]
            properties:
                status:
                    type: string
                    enum: [ok, degraded]
                database:
                    type: object
                    description: The result of pinging MongoDB.
                    required: [status, latencyMs]
                    properties:
                        status:
                            type: string
                            enum: [up, down]
                        latencyMs:
                            type: ["number", "null"]
                            description: Ping round trip, or `null` when the ping failed or timed out.
                eventLoopDelayMs:
                    type: object
                    description: How long callbacks waited for the event loop, recently.
                    required: [p50, p99]
                    properties:
                        p50:
                            type: number
                        p99:
                            type: number
                uptimeSeconds:
                    type: number
                    description: Seconds since this process started.

        Problem:
            type: object
            description: An error, in RFC 9457 Problem Details format.
            required: [type, title, status]
            properties:
                type:
                    type: string
                    format: uri-reference
                    description: Identifies the kind of problem. Stable; clients can switch on it.
                    examples: [/problems/validation-error]
                title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                status:
                    type: integer
                    description: The HTTP status code.
                detail:
                    type: string
                    description: What went wrong in this occurrence.
                instance:
                    type: string
                    format: uri-reference
                    description: The request path that failed.
                errors:
                    type: array
                    description: One entry per invalid field (validation errors only).
                    items:
                        $ref: "#/components/schemas/FieldError"

        FieldError:
            type: object
            required: [field, kind, message]
            properties:
                field:
                    type: string
                    examples: [code]
                kind:
                    type: string
                    description: Machine-readable reason, for example `too_short` or `reserved`.
                    examples: [reserved]
                message:
                    type: string
                    examples: ['"api" is reserved and cannot be used as a short code.']

    responses:
        ValidationError:
            description: |
                The request body is invalid: not valid JSON (`/problems/invalid-json`), or
                fields that are missing, of the wrong type, unknown or not allowed
                (`/problems/validation-error`, with one `errors` entry per field).
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: /problems/validation-error
                        title: Invalid request
                        status: 400
                        detail: One or more fields are invalid.
                        instance: /api/v1/links
                        errors:
                            - field: code
                              kind: reserved
                              message: '"api" is reserved and cannot be used as a short code.'

        InvalidQuery:
            description: |
                A query parameter is invalid (`/problems/validation-error`, with one
                `errors` entry per parameter): `limit` out of range, a `cursor` that
                wasn't produced by this API, or an unknown parameter.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: /problems/validation-error
                        title: Invalid request
                        status: 400
                        detail: One or more query parameters are invalid.
                        instance: /api/v1/links
                        errors:
                            - field: limit
                              kind: out_of_range
                              message: Must be a whole number from 1 to 100 (got "500").

        CodeTaken:
            description: The custom code is already in use.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: /problems/code-taken
                        title: Short code already taken
                        status: 409
                        detail: The code "my-resume" is already in use. Choose another.
                        instance: /api/v1/links

        BodyTooLarge:
            description: The request body is over the size limit (16 KiB).
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: /problems/body-too-large
                        title: Request body too large
                        status: 413
                        detail: The body must be at most 16384 bytes.
                        instance: /api/v1/links

        NotFound:
            description: No link with this code, or the link has expired.
            content:
                application/problem+json:
                    schema:
                        $ref: "#/components/schemas/Problem"
                    example:
                        type: /problems/link-not-found
                        title: Link not found
                        status: 404
                        detail: No active link has the code "aZ3kP9q".
                        instance: /aZ3kP9q
